<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простий Калькулятор</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="calculator">
        <h4 class="text-center text-muted mb-3">Калькулятор</h4>

        <input type="text" id="display" class="display" readonly value="">

        <div class="row g-2">
            <div class="col-6">
                <button class="btn btn-danger btn-calc" onclick="clearDisplay()">C</button>
            </div>
            <div class="col-6">
                <button class="btn btn-warning btn-calc" onclick="backspace()">⌫</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light btn-calc" onclick="appendCharacter('7')">7</button>
            </div>
            <div class="col-3">
                <button class="btn btn-light btn-calc" onclick="appendCharacter('8')">8</button>
            </div>
            <div class="col-3">
                <button class="btn btn-light btn-calc" onclick="appendCharacter('9')">9</button>
            </div>
            <div class="col-3">
                <button class="btn btn-secondary btn-calc" onclick="appendCharacter('*')">*</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light btn-calc" onclick="appendCharacter('4')">4</button>
            </div>
            <div class="col-3">
                <button class="btn btn-light btn-calc" onclick="appendCharacter('5')">5</button>
            </div>
            <div class="col-3">
                <button class="btn btn-light btn-calc" onclick="appendCharacter('6')">6</button>
            </div>
            <div class="col-3">
                <button class="btn btn-secondary btn-calc" onclick="appendCharacter('-')">-</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light btn-calc" onclick="appendCharacter('1')">1</button>
            </div>
            <div class="col-3">
                <button class="btn btn-light btn-calc" onclick="appendCharacter('2')">2</button>
            </div>
            <div class="col-3">
                <button class="btn btn-light btn-calc" onclick="appendCharacter('3')">3</button>
            </div>
            <div class="col-3">
                <button class="btn btn-secondary btn-calc" onclick="appendCharacter('+')">+</button>
            </div>

            <div class="col-3">
                <button class="btn btn-light btn-calc" onclick="appendCharacter('0')">0</button>
            </div>
            <div class="col-3">
                <button class="btn btn-light btn-calc" onclick="appendCharacter('.')">.</button>
            </div>
            <div class="col-3">
                <button class="btn btn-primary btn-calc" onclick="calculate()">=</button>
            </div>
            <div class="col-3">
                <button class="btn btn-secondary btn-calc" onclick="appendCharacter('/')">/</button>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
