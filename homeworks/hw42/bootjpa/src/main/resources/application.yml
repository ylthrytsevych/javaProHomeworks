spring:
  application:
    name: jpa-practice-app
  datasource:
    url: jdbc:mysql://localhost:3306/jpa_practice_db?createDatabaseIfNotExist=true
    username: root
    password: rootroot
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false # Вимикаємо, щоб уникнути N+1
    show-sql: false # Бачитимемо SQL у консолі